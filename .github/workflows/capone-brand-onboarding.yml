# Nightly CAPONE official-brand automation.
# 23:00 Türkiye = 20:00 UTC. The 07:00 general refresh excludes these sources.

name: CAPONE brand automation

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional maximum approved brands (blank means all)"
        required: false
        default: ""
      only:
        description: "Optional comma-separated approved slugs"
        required: false
        default: ""
      dry_run:
        description: "Collect and gate without publishing data"
        type: boolean
        required: false
        default: false

concurrency:
  group: capone-catalog-automation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  automate:
    name: Collect, gate, and publish when green
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run approved brand automation
        env:
          REQUESTED_LIMIT: ${{ inputs.limit || '' }}
          REQUESTED_ONLY: ${{ inputs.only || '' }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$REQUESTED_LIMIT" ]]; then args+=(--limit "$REQUESTED_LIMIT"); fi
          if [[ -n "$REQUESTED_ONLY" ]]; then args+=(--only "$REQUESTED_ONLY"); fi
          if [[ "$REQUESTED_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          npm run automate:brands -- "${args[@]}"

      - name: Tests
        run: npm test

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Stage deterministic data allowlist
        id: stage
        run: |
          set -euo pipefail
          npx tsx scripts/stage-brand-automation-data.ts
          if git diff --cached --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish validated brand delivery
        if: steps.stage.outputs.data_changed == 'true' && inputs.dry_run != true
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_BRANCH: automation/brand-refresh
          AUTOMATION_COMMIT_MESSAGE: "chore(data): publish validated official-brand refresh"
          AUTOMATION_PR_TITLE: "chore(data): validated automatic official-brand refresh"
          AUTOMATION_PR_BODY: "Approved-source official-brand automation. FULL coverage, taxonomy, baseline NEW, last-good, full tests, production build and Vercel Preview passed. This guarded PR is merged automatically; any failed gate preserves the previous delivery."
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-validated-automation-pr.sh

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-automation-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/registry/brand-automation-report.json
            data/onboarding/staging/*/catalog.json

      - name: Summary
        if: always()
        env:
          DATA_CHANGED: ${{ steps.stage.outputs.data_changed }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          MERGED: ${{ steps.publish.outputs.merged }}
          PRODUCTION_STATUS_URL: ${{ steps.publish.outputs.production_status_url }}
        run: |
          {
            echo "## CAPONE official-brand automation"
            echo "- Validated data changed: ${DATA_CHANGED:-false}"
            echo "- Guarded PR: ${PR_URL:-none}"
            echo "- Automatically merged: ${MERGED:-false}"
            echo "- Vercel production status: ${PRODUCTION_STATUS_URL:-none}"
            echo "- Failed gates preserve last-good"
          } >> "$GITHUB_STEP_SUMMARY"
