# Sunday 06:00 Türkiye. Validation is the default.
name: CAPONE weekly complete refresh

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and validate without publishing"
        type: boolean
        default: true

concurrency:
  group: capone-catalog-automation
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.ref != 'refs/heads/main' ||
      vars.CAPONE_REFRESH_PUBLISH_ENABLED != 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run != false)
    uses: ./.github/workflows/capone-refresh-cycle-run.yml

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.CAPONE_REFRESH_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    permissions:
      contents: write
      pull-requests: write
      statuses: read
      actions: read
    uses: ./.github/workflows/capone-refresh-cycle-run.yml
    with:
      publish: true
