name: Run complete CAPONE catalog refresh

on:
  workflow_call:
    inputs:
      publish:
        description: "Allow the validated delivery to be published"
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: ${{ inputs.publish }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore bounded marketplace progress and retry windows
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: logs/marketplace-progress/
          key: capone-marketplace-progress-v1-${{ !inputs.publish && 'validation-' || '' }}${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: capone-marketplace-progress-v1-${{ !inputs.publish && 'validation-' || '' }}${{ github.ref_name }}-
      - name: Verify every active source is covered
        run: node --import tsx scripts/run-refresh-cycle.ts --plan-only
      - name: Install approved marketplace browser runtime
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Refresh all active sources with lane rollback
        id: collect
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node --import tsx scripts/run-refresh-cycle.ts
      - name: Full tests once for the complete delivery
        # Save even when a later lane, validation or publication fails.
        id: tests
        run: npm test
      - name: Production build once for the complete delivery
        id: build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
      - name: Archive both catalogs and stage the delivery under 90 MiB
        id: stage
        run: |
          set -euo pipefail
          node --import tsx scripts/stage-refresh-cycle.ts
          if git diff --cached --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish through tested PR, exact preview and production verification
        if: >-
          success() && steps.stage.outputs.data_changed == 'true' &&
          inputs.publish && github.ref == 'refs/heads/main'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_BRANCH: automation/complete-refresh
          AUTOMATION_COMMIT_MESSAGE: "chore(data): publish complete weekly refresh"
          AUTOMATION_PR_TITLE: "chore(data): complete automatic CAPONE refresh"
          AUTOMATION_PR_BODY: "All active brands and marketplaces covered in one cycle. Failed lanes roll back, failed sources preserve last-good. One full test/build gate, exact-head Vercel Preview, guarded merge and Production verification. NEW is based on explicit official-source evidence."
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-validated-automation-pr.sh
      - name: Record final publication state and source evidence
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          DATA_CHANGED: ${{ steps.stage.outputs.data_changed }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          DRY_RUN: ${{ !inputs.publish }}
          MERGED: ${{ steps.publish.outputs.merged }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          PRODUCTION_STATUS_URL: ${{ steps.publish.outputs.production_status_url }}
        run: node --import tsx scripts/finalize-refresh-cycle.ts
      - name: Save bounded marketplace progress and retry windows
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: logs/marketplace-progress/
          key: capone-marketplace-progress-v1-${{ !inputs.publish && 'validation-' || '' }}${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-refresh-${{ github.run_id }}
          path: logs/refresh-cycle/
          retention-days: 30
          if-no-files-found: warn
