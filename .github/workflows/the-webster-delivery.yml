name: The Webster catalog delivery

# A single guarded run publishes only the verified FULL-coverage seed.

on:
  push:
    branches:
      - "integration/the-webster-delivery"
    paths:
      - "data/registry/the-webster-staging-seed.zip"
      - "scripts/publish-the-webster-staging.ts"
      - ".github/workflows/the-webster-delivery.yml"

permissions:
  contents: write

jobs:
  publish-verified-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore verified staging artifact
        run: |
          mkdir -p data/onboarding/staging/marketplaces/the-webster
          unzip -o data/registry/the-webster-staging-seed.zip -d data/onboarding/staging/marketplaces/the-webster
      - name: Publish full catalog to last-good delivery
        run: npm run publish:the-webster-staging
      - name: Rebuild analysis and model families
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run analyze:multibrand
          npm run build:model-families
      - name: Verify tests and production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm test
          npm run build
      - name: Commit verified generated delivery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/multibrand/products.json data/multibrand/analyzed-products.json data/multibrand/market-analysis.json
          git add data/multibrand/model-family-report.json data/multibrand/model-families data/multibrand/the-webster-coverage.json
          git add -f data/onboarding/staging/marketplaces/the-webster/catalog.json
          git add -f data/onboarding/staging/marketplaces/the-webster/last-good-report.json
          git add -f data/onboarding/staging/marketplaces/the-webster/latest-run-report.json
          if git diff --cached --quiet; then
            echo "Verified catalog already delivered."
          else
            git commit -m "chore(data): publish verified The Webster catalog"
            git push origin HEAD
          fi
