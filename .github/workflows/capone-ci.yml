name: CAPONE CI

on:
  pull_request:
  # GitHub skips pull_request workflows while this PR conflicts with main.
  # Push still runs the same job on the branch head, with no catalog rewrite.
  push:
    branches:
      - cursor/issue-91-official-brands-0302
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Full tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm test

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
