# Daily CAPONE data refresh.
# Schedule: 07:00 Türkiye time = 04:00 UTC (UTC+3, no DST).
#
# Safety contract:
# - collect into staging
# - run full tests and production build
# - stage only allow-listed refresh data
# - require a Vercel Preview before automatically merging validated data
# - never overwrite last-good after a failed/partial collect
#
# No OPENAI_API_KEY is used.

name: CAPONE daily refresh

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: capone-catalog-automation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  refresh:
    name: Collect, verify, and propose
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout last-good main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate last-good wave 50 delivery
        run: npm test -- src/brands/wave50/__tests__/wave50.delivery.qa.test.ts

      - name: Cloud data refresh
        env:
          CAPONE_REFRESH_MARKETPLACES: "false"
        run: npm run refresh:cloud

      - name: Tests
        id: tests
        run: npm test

      - name: Production build
        id: build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Stage allow-listed refresh data
        id: stage
        run: |
          set -euo pipefail
          npx tsx scripts/stage-cloud-refresh-data.ts
          if git diff --cached --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "No validated CAPONE data changes."
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish validated daily delivery
        if: success() && steps.stage.outputs.data_changed == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          AUTOMATION_BRANCH: automation/daily-refresh
          AUTOMATION_COMMIT_MESSAGE: "chore(data): publish validated CAPONE daily refresh"
          AUTOMATION_PR_TITLE: "chore(data): validated automatic CAPONE daily refresh"
          AUTOMATION_PR_BODY: "Staging-first daily refresh. Last-good isolation, full tests, production build and Vercel Preview passed. This guarded PR is merged automatically; any failed gate preserves the previous delivery."
        run: |
          set -euo pipefail
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          bash scripts/publish-validated-automation-pr.sh

      - name: Finalize job summary
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DATA_CHANGED: ${{ steps.stage.outputs.data_changed }}
          REFRESH_BRANCH: ${{ steps.publish.outputs.branch }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          MERGED: ${{ steps.publish.outputs.merged }}
          PRODUCTION_STATUS_URL: ${{ steps.publish.outputs.production_status_url }}
        run: |
          {
            echo "## CAPONE refresh gates"
            echo "- Tests: $TESTS_OUTCOME"
            echo "- Production build: $BUILD_OUTCOME"
            echo "- Validated data changed: $DATA_CHANGED"
            echo "- Branch: $REFRESH_BRANCH"
            echo "- Guarded PR: $PR_URL"
            echo "- Automatically merged: ${MERGED:-false}"
            echo "- Vercel production status: ${PRODUCTION_STATUS_URL:-none}"
            echo ""
            echo "Failed, empty, partial, or rejected collections preserve last-good."
          } >> "$GITHUB_STEP_SUMMARY"
