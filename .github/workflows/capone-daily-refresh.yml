# Daily CAPONE data refresh.
# Schedule: 07:00 Türkiye time = 04:00 UTC (UTC+3, no DST).
#
# Safety contract:
# - collect into staging
# - run full tests and production build
# - stage only allow-listed refresh data
# - open a unique draft PR when data changed
# - never push directly to main or trigger a production deployment
# - never overwrite last-good after a failed/partial collect
#
# No OPENAI_API_KEY is used.

name: CAPONE daily refresh

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: capone-daily-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Collect, verify, and propose
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout last-good main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cloud data refresh
        run: npm run refresh:cloud

      - name: Tests
        id: tests
        run: npm test

      - name: Production build
        id: build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Stage allow-listed refresh data
        id: stage
        run: |
          set -euo pipefail
          npx tsx scripts/stage-cloud-refresh-data.ts
          if git diff --cached --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "No validated CAPONE data changes."
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create isolated refresh branch and commit
        if: success() && steps.stage.outputs.data_changed == 'true'
        id: commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          branch="automation/daily-refresh-$GITHUB_RUN_ID"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git switch -c "$branch"
          git commit -m "chore(data): propose validated CAPONE daily refresh"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "commit_created=true" >> "$GITHUB_OUTPUT"

      - name: Open draft refresh PR
        if: success() && steps.commit.outputs.commit_created == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          pr_url="$(gh pr create             --draft             --base main             --head "$REFRESH_BRANCH"             --title "chore(data): validated CAPONE daily refresh"             --body "Automated staging-first refresh. Full tests and production build passed before this proposal was created. Review source coverage, last-good preservation and the Vercel Preview before merge. No automatic merge or production deploy.")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Finalize job summary
        if: always()
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DATA_CHANGED: ${{ steps.stage.outputs.data_changed }}
          COMMIT_CREATED: ${{ steps.commit.outputs.commit_created }}
          REFRESH_BRANCH: ${{ steps.commit.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo "## CAPONE refresh gates"
            echo "- Tests: $TESTS_OUTCOME"
            echo "- Production build: $BUILD_OUTCOME"
            echo "- Validated data changed: $DATA_CHANGED"
            echo "- Isolated commit created: $COMMIT_CREATED"
            echo "- Branch: $REFRESH_BRANCH"
            echo "- Draft PR: $PR_URL"
            echo ""
            echo "Main and production were not modified. Failed, empty, partial, or rejected collections preserve last-good."
          } >> "$GITHUB_STEP_SUMMARY"
