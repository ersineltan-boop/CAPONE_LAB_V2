# 00:30 Türkiye = 21:30 UTC. Safe official-source onboarding for inactive brands.
name: CAPONE automatic new-brand onboarding

on:
  push:
    branches: [main]
    paths:
      - src/collector/jwAnderson.ts
      - src/collector/margaux.ts
      - src/collector/salesforceCommerce/casadei.ts
      - src/collector/salesforceCommerce/jilSander.ts
      - src/collector/tkees.ts
      - src/collector/sergioRossi.ts
      - src/collector/officialBrandWave.ts
      - src/collector/salesforceCommerce/integration.ts
      - src/collector/salesforceCommerce/coverage.ts
      - src/collector/salesforceCommerce/families.ts
      - src/collector/salesforceCommerce/gallery.ts
      - src/collector/salesforceCommerce/types.ts
      - src/onboarding/selection.ts
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probe and report without activating brands"
        type: boolean
        required: false
        default: false

concurrency:
  group: capone-catalog-automation
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  onboard:
    name: Discover, validate, and safely publish
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout last-good main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover marketplace-evidenced brand names
        run: npm run discover:brands

      - name: Process safe official-source candidate queue
        env:
          REQUESTED_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TRIGGER_EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--limit 25 --max-activations 3)
          # A collector delivery immediately verifies only its own candidate.
          if [[ "$TRIGGER_EVENT" == "push" ]]; then
            targets=()
            for slug in jw-anderson margaux casadei jil-sander tkees sergio-rossi coperni paloma-wool pazzion moon-boot pedro-miralles; do
              collector="$slug"
              if [[ "$slug" == "jw-anderson" ]]; then collector=jwAnderson; fi
              path="src/collector/${collector}.ts"
              if [[ "$slug" == "casadei" ]]; then path=src/collector/salesforceCommerce/casadei.ts; fi
              if [[ "$slug" == "jil-sander" ]]; then path=src/collector/salesforceCommerce/jilSander.ts; fi
              if [[ "$slug" == "tkees" ]]; then path=src/collector/tkees.ts; fi
              if [[ "$slug" == "sergio-rossi" ]]; then path=src/collector/sergioRossi.ts; fi
              paths=("$path")
              if [[ "$slug" == "coperni" || "$slug" == "paloma-wool" || "$slug" == "pazzion" || "$slug" == "moon-boot" || "$slug" == "pedro-miralles" ]]; then
                paths=(src/collector/officialBrandWave.ts)
              fi
              if [[ "$slug" == "casadei" || "$slug" == "jil-sander" ]]; then
                paths+=(src/collector/salesforceCommerce/integration.ts src/collector/salesforceCommerce/coverage.ts
                  src/collector/salesforceCommerce/families.ts src/collector/salesforceCommerce/gallery.ts
                  src/collector/salesforceCommerce/types.ts src/onboarding/selection.ts)
              fi
              if ! git diff --quiet "$PUSH_BEFORE" "$PUSH_AFTER" -- "${paths[@]}"; then
                targets+=("$slug")
              fi
            done
            if (( ${#targets[@]} == 0 )); then echo "No delivered collector found" >&2; exit 1; fi
            only=$(IFS=,; echo "${targets[*]}")
            args=(--only "$only" --limit "${#targets[@]}" --max-activations "${#targets[@]}")
          fi
          if [[ "$REQUESTED_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          npm run onboard:brands -- "${args[@]}"

      - name: Full tests
        run: npm test

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Stage deterministic onboarding allowlist
        id: stage
        run: |
          set -euo pipefail
          npx tsx scripts/stage-brand-onboarding-data.ts
          if git diff --cached --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish validated new-brand delivery
        if: steps.stage.outputs.data_changed == 'true' && inputs.dry_run != true
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_BRANCH: automation/new-brand-onboarding
          AUTOMATION_COMMIT_MESSAGE: "chore(data): publish validated new-brand onboarding"
          AUTOMATION_PR_TITLE: "chore(data): validated automatic new-brand onboarding"
          AUTOMATION_PR_BODY: "Official-source new-brand onboarding. Maximum 25 attempts and 3 activations. Only FULL quality-gate deliveries proceed through tests, production build and Vercel Preview to a draft PR. Failed or partial candidates preserve last-good; merge and production deployment are not automatic."
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-validated-automation-pr.sh

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-brand-onboarding-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/registry/brand-discovery-report.json
            data/registry/brand-onboarding-queue.json
            data/registry/brand-onboarding-report.json
            data/registry/brand-adapter-work-queue.json

      - name: Summary
        if: always()
        env:
          DATA_CHANGED: ${{ steps.stage.outputs.data_changed }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          MERGED: ${{ steps.publish.outputs.merged }}
          PRODUCTION_STATUS_URL: ${{ steps.publish.outputs.production_status_url }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          {
            echo "## CAPONE automatic new-brand onboarding"
            if [[ "$TRIGGER_EVENT" == "push" ]]; then
              echo "- Targeted verification of delivered official collectors"
            else
              echo "- Attempt limit: 25"
              echo "- Activation limit: 3"
            fi
            echo "- Validated data changed: ${DATA_CHANGED:-false}"
            echo "- Guarded PR: ${PR_URL:-none}"
            echo "- Merged by automation (must stay false): ${MERGED:-false}"
            echo "- Vercel production status: ${PRODUCTION_STATUS_URL:-none}"
            echo "- Failed/partial sources preserve last-good"
          } >> "$GITHUB_STEP_SUMMARY"
